name: Canyon XS watch

on:
  schedule:
    # GitHub throttles scheduled runs badly (a */15 cron here actually fired
    # every 42 min on average, 163 min at worst), so the cron only *starts* a
    # run -- the run itself then polls every 3 min for ~50 min. The concurrency
    # group below keeps exactly one run live and one queued, which in practice
    # means continuous coverage.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

# Never let two runs race on state.json.
concurrency:
  group: canyon-watch
  cancel-in-progress: false

permissions:
  contents: write   # required to commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    # Must comfortably exceed CANYON_RUN_DURATION (~50 min) so the loop is
    # never killed mid-flight.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Canyon availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python canyon_watch.py

      # `if: always()` matters: on a failed check the script exits non-zero, and
      # without this the state file -- including the consecutive-failure counter
      # that drives the "watcher needs attention" alert -- was never committed,
      # so that counter could never reach its threshold.
      - name: Persist state
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "No change to state.json"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Long-running runs can overlap, so two of them may write state.json
          # and collide. The previous `git pull --rebase || true` swallowed the
          # conflict and left the repo mid-rebase on a detached HEAD, so the
          # push then died with exit 128.
          #
          # Don't merge: state.json is a snapshot of live truth, not an
          # accumulated history, so there is nothing to reconcile. Replay our
          # snapshot on top of whatever the remote has and retry on races.
          cp state.json "$RUNNER_TEMP/state.mine"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/state.mine" state.json

            if [[ -z "$(git status --porcelain state.json)" ]]; then
              echo "Remote already matches our state; nothing to push"
              exit 0
            fi

            git add state.json
            git commit --quiet -m "Update availability state [skip ci]"

            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Pushed state on attempt $attempt"
              exit 0
            fi

            echo "Push raced with another run; retrying ($attempt/5)"
            sleep $(( attempt * 3 ))
          done

          echo "Could not push state after 5 attempts" >&2
          exit 1
